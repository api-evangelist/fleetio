aid: fleetio
url: https://raw.githubusercontent.com/api-evangelist/fleetio/refs/heads/main/apis.yml
name: Fleetio
kind: company
description: Fleetio is a cloud-based fleet management software platform that helps
  organizations track and manage vehicles, equipment, maintenance, fuel, parts, and
  inspections. The Fleetio Developer API is a JSON REST API at https://secure.fleetio.com/api
  for managing vehicles, contacts, fuel entries, service entries, work orders, parts,
  inspections, and issues, with webhooks for event notifications.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
