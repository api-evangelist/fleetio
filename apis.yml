  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.fleetio.com/docs/api/issues
  baseURL: https://secure.fleetio.com/api/v1
  properties:
  - url: https://developer.fleetio.com/docs/api/issues
    type: Documentation
  - url: openapi/fleetio-openapi.yml
    type: OpenAPI
  description: Track vehicle issues and defects reported by operators or surfaced by
    inspections, with status, assignment, and resolution into work orders or service
    entries.
- aid: fleetio:webhooks
