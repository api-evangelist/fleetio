openapi: 3.0.1
info:
  title: Fleetio Developer API
  description: >-
    JSON REST API for the Fleetio fleet management platform. Manage vehicles,
    contacts, fuel entries, service entries, work orders, service reminders,
    parts and inventory, inspections, and issues, and register webhooks for
    event notifications. All access is over HTTPS and all data is sent and
    received as JSON.
  termsOfService: https://www.fleetio.com/legal/terms
  contact:
    name: Fleetio Developer Support
    url: https://developer.fleetio.com/
  version: '2025-05-05'
servers:
  - url: https://secure.fleetio.com/api
    description: Fleetio production API
security:
  - AuthorizationToken: []
    AccountToken: []
tags:
  - name: Vehicles
  - name: Contacts
  - name: Fuel Entries
  - name: Service Entries
  - name: Work Orders
  - name: Service Reminders
  - name: Parts
  - name: Inventory Journal Entries
  - name: Inspections
  - name: Issues
  - name: Webhooks
paths:
  /v1/vehicles:
    get:
      operationId: listVehicles
      tags:
        - Vehicles
      summary: List vehicles
      description: Returns a paginated array of all vehicles in the account.
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/StartCursor'
      responses:
        '200':
          description: A list of vehicles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
    post:
      operationId: createVehicle
      tags:
        - Vehicles
      summary: Create a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicle'
      responses:
        '201':
          description: The created vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
  /v1/vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getVehicle
      tags:
        - Vehicles
      summary: Get a vehicle
      responses:
        '200':
          description: The requested vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
    patch:
      operationId: updateVehicle
      tags:
        - Vehicles
      summary: Update a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicle'
      responses:
        '200':
          description: The updated vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
    delete:
      operationId: deleteVehicle
      tags:
        - Vehicles
      summary: Delete a vehicle
      responses:
        '204':
          description: The vehicle was deleted.
