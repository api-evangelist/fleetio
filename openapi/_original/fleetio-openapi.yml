components:
  securitySchemes:
    AuthorizationToken:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        API key associated with a Fleetio user, prefixed with the word "Token"
        (e.g. "Authorization: Token YOUR_API_KEY"). Generate keys at
        https://secure.fleetio.com/api_keys.
    AccountToken:
      type: apiKey
      in: header
      name: Account-Token
      description: Account token identifying the Fleetio account.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: The unique identifier of the resource.
      schema:
        type: integer
        format: int64
    PerPage:
      name: per_page
      in: query
      required: false
      description: Number of records to return per page.
      schema:
        type: integer
        default: 50
        maximum: 100
    StartCursor:
      name: start_cursor
      in: query
      required: false
      description: Cursor for cursor-based pagination of list results.
      schema:
        type: string
  schemas:
    Vehicle:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        account_id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        vehicle_make:
          type: string
        vehicle_model:
          type: string
        vehicle_year:
          type: integer
        vin:
          type: string
        license_plate:
          type: string
        group_id:
          type: integer
          format: int64
        vehicle_status_name:
          type: string
        vehicle_type_name:
          type: string
        primary_meter_value:
          type: number
        primary_meter_unit:
          type: string
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Contact:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        account_id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        group_id:
          type: integer
          format: int64
        technician:
          type: boolean
        vehicle_operator:
          type: boolean
        employee:
          type: boolean
        license_number:
          type: string
        mobile_phone_number:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    FuelEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        vehicle_id:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
        us_gallons:
          type: number
        cost:
          type: number
        price_per_volume_unit:
          type: number
        total_amount:
          type: number
        usage_in_mi:
          type: number
        meter_value:
          type: number
        is_full:
          type: boolean
        personal:
          type: boolean
        vendor_id:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ServiceEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        vehicle_id:
          type: integer
          format: int64
        completed_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        meter_value:
          type: number
        total_amount:
          type: number
        labor_subtotal:
          type: number
        parts_subtotal:
          type: number
        vendor_id:
          type: integer
          format: int64
          nullable: true
        is_sample:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ServiceReminder:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        vehicle_id:
          type: integer
          format: int64
        service_task_id:
          type: integer
          format: int64
        service_task_name:
          type: string
        due_soon_threshold:
          type: number
        time_due_date:
          type: string
          format: date
          nullable: true
        meter_due_value:
          type: number
          nullable: true
        next_due_status:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    WorkOrder:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        number:
          type: string
        vehicle_id:
          type: integer
          format: int64
        work_order_status_id:
          type: integer
          format: int64
        work_order_status_name:
          type: string
        issued_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        meter_value:
          type: number
        total_amount:
          type: number
        labor_subtotal:
          type: number
        parts_subtotal:
          type: number
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Part:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        number:
          type: string
        description:
          type: string
        manufacturer_part_number:
          type: string
        upc:
          type: string
        unit_cost:
          type: number
        measurement_unit_name:
          type: string
        part_category_name:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    InventoryJournalEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        part_id:
          type: integer
          format: int64
        part_location_id:
          type: integer
          format: int64
          nullable: true
        quantity:
          type: number
        unit_cost:
          type: number
        journal_type:
          type: string
        description:
          type: string
        performed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
    InspectionForm:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        description:
          type: string
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    SubmittedInspectionForm:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        inspection_form_id:
          type: integer
          format: int64
        vehicle_id:
          type: integer
          format: int64
        submitted_at:
          type: string
          format: date-time
        contact_id:
          type: integer
          format: int64
          nullable: true
        failed_items_count:
          type: integer
        passed:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
    Issue:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        number:
          type: integer
        vehicle_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
