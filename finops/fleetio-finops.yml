description: >-
  FinOps view of Fleetio spend. Fleetio bills as a per-vehicle (per-asset) SaaS
  subscription across Essential, Professional, and Premium editions with a
  5-vehicle minimum, billed monthly or annually. Cost is driven primarily by
  the number of active (non-archived) vehicles and the chosen edition; the
  Developer API and unlimited users are included rather than separately metered.
notes: >-
  Per-vehicle rates vary by fleet-size band and contract term; verify against
  the Fleetio pricing page during reconciliation.
