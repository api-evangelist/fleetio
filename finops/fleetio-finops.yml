meters:
- name: active_vehicles
  description: Active (non-archived) vehicles or assets under management, the primary billable unit.
  unit: vehicles
  aggregation: max
  dimensions:
  - account
  - plan
  - group
- name: plan_edition
  description: Subscription edition (Essential, Professional, Premium) determining per-vehicle rate and feature access.
  unit: edition
  aggregation: latest
  dimensions:
  - account
- name: contract_term
  description: Contract and payment term (annual vs. monthly) affecting the per-vehicle rate.
  unit: term
  aggregation: latest
  dimensions:
  - account
principles:
- name: Visibility
  description: Track active vs. archived vehicle counts; reconcile billed assets against vehicles actually in service.
- name: Allocation
  description: Use Fleetio groups to map vehicles to internal cost centers, sites, or business units.
- name: Optimization
  description: Archive retired or sold vehicles promptly to stop billing; pick the lowest edition that meets workflow needs; commit annually for the lower per-vehicle rate.
- name: Accountability
  description: Assign group owners and review the active-vehicle count and edition against budget before each renewal.
